CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Advertised BLE name must be plain ASCII — the "å" in "Kibård" is non-ASCII
# UTF-8 and produces a name field that host stacks silently drop, so the
# keyboard never appears in a Bluetooth scan.
CONFIG_ZMK_KEYBOARD_NAME="Kibard"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Improved connection stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable mouse emulations
CONFIG_ZMK_POINTING=y

# Fetch the peripheral (right) half's battery level over the split link and
# proxy it to the host as an additional BLE Battery Service instance, so both
# halves' levels are readable. PROXY defaults off, so both lines are required.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Layer status reporting for the Keyboard Layers App Companion desktop app
# (zmk-feature-appcompanion module). Central-only — the module's Kconfig
# already excludes the peripheral half.
#
# BLE/HID variant: stuffs the active layer number into the reserved byte of
# the standard keyboard report, so it works over BLE *and* USB. Reading it on
# the host means reading raw keyboard reports (root/udev rule on Linux).
CONFIG_ZMK_LAYER_STATUS_BLE_HID=y

# USB raw-HID variant: a second HID interface (HID_1) carrying a 32-byte
# report — readable without root, but only while cabled. Set the device count
# to 2 or the module finds no interface at runtime.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_LAYER_STATUS_USB_HID=y

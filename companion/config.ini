[KEYBOARD_USB_HID]
# Matches CONFIG_ZMK_LAYER_STATUS_USB_HID_USAGE_PAGE / _USAGE defaults in
# the zmk-feature-appcompanion module (kibard_left.conf leaves them default).
usage_page = 0xFF60
usage = 0x61

[KEYBOARD_BLE_HID]
# ZMK's default USB and BLE DIS PnP identifiers (nice_nano_v2 / Kibard).
# Verify with: python main.py --ble  (it lists every HID device it can see)
vendor_id = 0x1D50
product_id = 0x615E

[LAYER_IMAGES]
# The app loads images from ./assets/ relative to its own directory;
# companion/install.sh symlinks companion/images/*.png in there.
# Indices must match the layer order in config/kibard.keymap.
layer_0 = kibard-graphmod.png
layer_1 = kibard-symbols.png
layer_2 = kibard-numpad.png
layer_3 = kibard-mouse.png
layer_4 = kibard-right.png
layer_5 = kibard-navigate.png
layer_6 = kibard-vim.png
layer_7 = kibard-functions.png
layer_8 = kibard-b.png
layer_9 = kibard-hex.png
# Layers 10/11 (Mouse fast / Mouse slow) hold no bindings — they only scale the
# pointer while held from the Mouse layer — so they reuse the Mouse image rather
# than showing a grid of &trans.
layer_10 = kibard-mouse.png
layer_11 = kibard-mouse.png

# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
# Board target is Zephyr hardware-model v2: `nice_nano_v2` became
# `nice_nano@2.0.0//zmk`, short `nice_nano//zmk` (2.0.0 is the default
# revision, and ZMK board definitions now require the `zmk` variant).
# `artifact-name` keeps the download names clean — the workflow would
# otherwise fold the slashes into `kibard_left-nice_nano__zmk-zmk`.
include:
  - board: nice_nano//zmk
    shield: kibard_left
    artifact-name: kibard_left
  - board: nice_nano//zmk
    shield: kibard_right
    artifact-name: kibard_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset

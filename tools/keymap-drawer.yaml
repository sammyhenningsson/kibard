parse_config:
  # The keymap's SE_* defines are plain #defines, so the preprocessor turns them
  # into US keycodes before keymap-drawer sees them. These keys get preprocessed
  # the same way, so mapping them back by their SE_ names is safe.
  raw_binding_map:
    "&kp SE_CIRC": "^"
    "&kp SE_DOLLAR": "$"
    "&kp SE_COLON": ":"
    "&kp SE_SEMI": ";"
    "&kp SE_AMPR": "&"
    "&kp SE_ACUT": "´"
    "&kp SE_AT": "@"
    "&kp SE_SLASH": "/"
    "&kp SE_QUES": "?"
    "&kp SE_DQUOT": "\""
    "&kp SE_APOS": "'"
    "&kp SE_LESS": "<"
    "&kp SE_MINUS": "-"
    "&kp SE_UNDER": "_"
    "&kp SE_EQUAL": "="
    "&kp SE_GRTR": ">"
    "&kp SE_LBRACE": "{"
    "&kp SE_RBRACE": "}"
    "&kp SE_BSLS": "\\"
    "&kp SE_TILDE": "~"
    "&kp SE_LPAR": "("
    "&kp SE_RPAR": ")"
    "&kp SE_PLUS": "+"
    "&kp SE_ASTR": "*"
    "&kp SE_GRAV": "`"
    "&kp SE_LBRACKET": "["
    "&kp SE_RBRACKET": "]"
    "&kp SE_PIPE": "|"
    "&kp SE_SECT": "§"
    "&kp SE_PERCENT": "%"
    "&kp SE_EXCLAM": "!"
    "&kp SE_POUND": "#"
    "&kp SE_MICRO": "µ"
    "&kp SE_EURO": "€"
    "&kp SE_STERLING": "£"
    "&kp SE_ADIA": "Ä"
    "&kp SE_AA": "Å"
    "&kp SE_OO": "Ö"
    # Dead-key macros: each taps the dead key and then the character that
    # completes it, so they draw as the composed result, not the dead key.
    "&acut": "´"
    "&grav": "`"
    "&tilde": "~"
    "&circ": "^"
    "&eacut": "é"
    "&ocirc": "ô"
    # Adaptive swaps and keys: the shifted legend reads "after X, this key types Y".
    "&AS_E": {t: "E", h: "RSHIFT", s: "U→O K→H"}
    "&AS_O": {t: "O", s: "U→E"}
    "&AS_H": {t: "H", h: "LALT", s: "K→E"}
    "&AS_G": {t: "G", s: "F→L"}
    "&AS_L": {t: "L", s: "F→G"}
    "&AS_D": {t: "D", s: "S→C"}
    "&AS_C": {t: "C", s: "S→D L→F"}
    "&AS_F": {t: "F", h: "Functions", s: "L→C"}
    "&AS_PG": {t: "G", s: "M→Ö"}
    "&AS_POO": {t: "Ö", s: "M→G"}
    "&AK_X": {t: "X", h: "LCTRL", s: "J→U"}
    "&AK_Z": {t: "Z", s: "J→O"}
    "&AK_S": {t: "S", h: "LSHIFT", s: "Å/Ö→R"}
    "&AK_T": {t: "T", s: "F→Ö"}
    # Vim macros: label each with the command it types.
    "&vim_write": ":w"
    "&vim_force_write": ":w!"
    "&vim_close": ":q"
    "&vim_discard": ":q!"
    "&vim_close_all": ":qa"
    "&vim_gwrite": ":Gwrite"
    "&vim_mk_session": ":mks!"
    "&vim_last_edit": "g;"
    "&vim_win_left": "Win ←"
    "&vim_win_down": "Win ↓"
    "&vim_win_up": "Win ↑"
    "&vim_win_right": "Win →"
    "&msc SCRL_LEFT": "Scroll ←"
    "&msc SCRL_RIGHT": "Scroll →"
    "&msc SCRL_UP": "Scroll ↑"
    "&msc SCRL_DOWN": "Scroll ↓"
    "&mmv MOVE_LEFT": "Move ←"
    "&mmv MOVE_RIGHT": "Move →"
    "&mmv MOVE_UP": "Move ↑"
    "&mmv MOVE_DOWN": "Move ↓"
    "&mkp MB1": "LClick"
    "&mkp MB2": "RClick"
    "&mkp MB3": "MClick"
draw_config:
  key_w: 62
  key_h: 56
  append_colon_to_layer_header: false
